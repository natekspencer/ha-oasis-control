name: Update tracks

on:
  schedule:
    - cron: "0 19 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  tracks:
    name: Search and update new tracks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install homeassistant aiomqtt

      - name: Update tracks
        env:
          GROUNDED_TOKEN: ${{ secrets.GROUNDED_TOKEN }}
        run: python update_tracks.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update tracks
          title: Update tracks
          body: Update tracks
          base: main
          labels: automated-pr, tracks
          branch: update-tracks
